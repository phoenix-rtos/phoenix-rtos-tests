test:
    tests:
        - name: test_thread_rand
          type: unity
          execute: test_thread_rand

        - name: test_cputime
          type: unity
          execute: test_cputime
          targets:
              # only for targets with cputime enabled
              value: [
                ia32-generic-qemu,
              ]

        - name: test_priority
          load:
            - app: test_priority
          harness: test_priority.py
