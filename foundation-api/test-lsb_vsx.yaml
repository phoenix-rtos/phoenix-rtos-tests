          # 7: ulimit() is POSIX XSI extension
          # 10: job control is not supported (POSIX deviation)
          # 11: no device without free space (VSX_NOSPC_DEV)
          # 12, 13: not in use in the VSX configuration (NOTINUSE)
        - name: T.fputs
          execute: run-test /tset/ANSI.os/streamio/fputs/T.fputs{1-5,8-9}
          kwargs:
            testcase_count: 13

