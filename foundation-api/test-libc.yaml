# Foundation API campaign - libc tests of the selected Foundation API functions.
# Only the test groups of these functions are run: the Unity group filter (-g) selects every
# group whose name contains the given string. Cases failing because of a reported issue of the
# tested function are skipped with the issue number.
test:
  type: unity
  nightly: true
  targets:
    value: [ia32-generic-qemu]

  tests:
    - name: dirent-dirent_opendir
      execute: test-libc-dirent -g dirent_opendir

    - name: dirent-dirent_closedir
      execute: test-libc-dirent -g dirent_closedir

    - name: dirent-dirent_readdir
      execute: test-libc-dirent -g dirent_readdir

    - name: dirent-dirent_rewinddir
      execute: test-libc-dirent -g dirent_rewinddir

    - name: dirent-dirent_fdopendir
      execute: test-libc-dirent -g dirent_fdopendir

    - name: dirent-dirent_seekdir_telldir
      execute: test-libc-dirent -g dirent_seekdir_telldir

    - name: dirent-dirent_scandir
      execute: test-libc-dirent -g dirent_scandir

    - name: exit-unistd_exit
      execute: test-libc-exit -g unistd_exit

    - name: exit-unistd_Exit
      execute: test-libc-exit -g unistd_Exit

    - name: exit-stdlib_exit
      execute: test-libc-exit -g stdlib_exit

    - name: exit-stdlib_at_quick_exit
      execute: test-libc-exit -g stdlib_at_quick_exit

    - name: exit-stdlib_quick_exit
      execute: test-libc-exit -g stdlib_quick_exit

    - name: fcntl-fcntl_creat
      execute: test-libc-fcntl -g fcntl_creat

    - name: fcntl-fcntl_fcntl
      execute: test-libc-fcntl -g fcntl_fcntl

    # the name filter excludes the fcntl_openat group
    - name: fcntl-fcntl_open
      execute: test-libc-fcntl -g fcntl_open -n open_

    # the name filter excludes the fileops_readlinkat group
    - name: fileops-fileops_readlink
      execute: test-libc-fileops -g fileops_readlink -n readlink_

    - name: group-getpwd
      execute: test-libc-group -g getpwd

    # the filter also selects grp_getgrgid_r
    - name: group-grp_getgrgid
      execute: test-libc-group -g grp_getgrgid

    # the filter also selects grp_getgrnam_r
    - name: group-grp_getgrnam
      execute: test-libc-group -g grp_getgrnam

    # the filter also selects grp_getgrgid_r
    - name: grp-grp_getgrgid
      execute: test-libc-grp -g grp_getgrgid

    # the filter also selects grp_getgrnam_r
    - name: grp-grp_getgrnam
      execute: test-libc-grp -g grp_getgrnam

    # ioctl() is tested by the binaries of the ioctl directory, outside of the libc tests
    - name: ioctl-test-ioctl
      execute: test-ioctl

    - name: ioctl-test-ioctl-nested
      execute: test-ioctl-nested

    - name: mman-mman_mmap
      execute: test-libc-mman -g mman_mmap

    - name: mman-mman_munmap
      execute: test-libc-mman -g mman_munmap

    - name: misc-stdlib_realpath
      execute: test-libc-misc -g stdlib_realpath

    - name: misc-unistd_getopt
      execute: test-libc-misc -g unistd_getopt

    - name: misc-unistd_fsdir
      execute: test-libc-misc -g unistd_fsdir

    # the filter also selects unistd_file_pread, unistd_file_safe and unistd_file_safe_pread
    - name: misc-unistd_file
      execute: test-libc-misc -g unistd_file

    - name: misc-stat_mode
      execute: test-libc-misc -g stat_mode

    - name: misc-stat_nlink_size_blk_tim
      execute: test-libc-misc -g stat_nlink_size_blk_tim

    - name: misc-stat_errno
      execute: test-libc-misc -g stat_errno

    - name: misc-misc_umask
