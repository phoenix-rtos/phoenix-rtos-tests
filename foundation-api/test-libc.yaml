    # the filter selects all pthread_attr* groups
    - name: pthread-pthread_attr
      execute: test-libc-pthread -g pthread_attr

    # the filter selects all pthread_mutex* groups
    - name: pthread-pthread_mutex
      execute: test-libc-pthread -g pthread_mutex

    # the filter selects all pthread_cond* and test_pthread_cond groups
    - name: pthread-pthread_cond
      execute: test-libc-pthread -g pthread_cond

    - name: pthread-test_pthread_cleanup
      execute: test-libc-pthread -g test_pthread_cleanup

