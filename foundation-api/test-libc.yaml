      execute: test-libc-misc -g unistd_getsid

    - name: misc-unistd_setpgrp
      execute: test-libc-misc -g unistd_setpgrp

    - name: misc-unistd_setpgid
      execute: test-libc-misc -g unistd_setpgid

    - name: misc-unistd_setsid
      execute: test-libc-misc -g unistd_setsid

